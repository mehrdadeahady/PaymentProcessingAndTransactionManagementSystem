version: "3.9"

services:

  django:
    build: .
    container_name: fintech_django

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn fintech.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

  celery:
    build: .
    container_name: fintech_celery

    command: celery -A fintech worker --loglevel=info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16

    container_name: fintech_postgres

    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: fintech_redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: